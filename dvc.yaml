stages:
  bootstrap:
    cmd: python -c "import sys; sys.path.insert(0, 'src'); from lab1.cli import main; main(['bootstrap'])"
    deps:
      - kaggle/train.csv
      - kaggle/stores.csv
      - kaggle/holidays_events.csv
      - kaggle/oil.csv
      - kaggle/transactions.csv
      - src/lab1/simulate.py
    params:
      - config/params.yaml:
          - simulation
    outs:
      # Derivados directos de los archivos de Kaggle: se versionan por hash pero NO se suben al
      # remoto público (las reglas de Kaggle no permiten redistribuir los datos). Se regeneran con
      # `dvc repro bootstrap` a partir de los CSV que coloca cada usuario en kaggle/.
      - data/history:
          push: false
      - data/inbox:
          push: false
